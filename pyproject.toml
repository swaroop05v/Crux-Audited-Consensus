[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crux"
version = "0.1.0"
description = "Crux-Audited Consensus for Weak-Judge Oversight, built on collaborative-dr"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
local = ["torch>=2.1", "transformers>=4.51", "accelerate"]  # hf_local judges; 4.51+ for Qwen3 and Gemma 3 templates; accelerate for device_map

[project.scripts]
crux = "crux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
